# ═══════════════════════════════════════════════════════════
#  API Gateway — Deployment + Service
#  Punto de entrada centralizado del frontend
#  GETs → repos directos | Writes → broker
# ═══════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: novalink
    component: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      component: api-gateway
  template:
    metadata:
      labels:
        app: novalink
        component: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: novalink/api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: NODE_ENV
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: JWT_SECRET_KEY
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: RABBITMQ_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: AUTH_SERVICE_URL
            # ── Orders DB ──────────────────────────────────
            - name: ORDERS_DB_HOST
              value: "orders-db"
            - name: ORDERS_DB_PORT
              value: "5432"
            - name: ORDERS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: ORDERS_DB_NAME
            - name: ORDERS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: ORDERS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
            # ── Users DB ───────────────────────────────────
            - name: USERS_DB_HOST
              value: "users-db"
            - name: USERS_DB_PORT
              value: "5432"
            - name: USERS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: USERS_DB_NAME
            - name: USERS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: USERS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
            # ── Products DB ────────────────────────────────
            - name: PRODUCTS_DB_HOST
              value: "products-db"
            - name: PRODUCTS_DB_PORT
              value: "5432"
            - name: PRODUCTS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: PRODUCTS_DB_NAME
            - name: PRODUCTS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: PRODUCTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
            # ── Notifications DB ───────────────────────────
            - name: NOTIF_DB_HOST
              value: "notifications-db"
            - name: NOTIF_DB_PORT
              value: "5432"
            - name: NOTIF_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: NOTIFICATIONS_DB_NAME
            - name: NOTIF_DB_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: NOTIF_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: novalink
    component: api-gateway
spec:
  selector:
    component: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
  type: NodePort