# ═══════════════════════════════════════════════════════════
#  Auth Service — Deployment + Service
# ═══════════════════════════════════════════════════════════

# ─── Auth Service Deployment ───────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: novalink
    component: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: auth-service
  template:
    metadata:
      labels:
        app: novalink
        component: auth-service
    spec:
      containers:
        - name: auth
          image: novalink/auth-service:8e1bdef4a61826cf2508a686197b99b91eb00b3c
          # En Minikube se usa la imagen local; no se descarga de registry
          imagePullPolicy: Never
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: NODE_ENV
            - name: DB_HOST
              value: "users-db"    # Conexión a la BD de usuarios
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: USERS_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_EXPIRATION
              value: "24h"
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 15

---
# ─── Auth Service Service ───────────────
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: novalink
    component: auth-service
spec:
  type: NodePort
  selector:
    component: auth-service
  ports:
    - protocol: TCP
      port: 3005
      targetPort: 3005
      nodePort: 30005
