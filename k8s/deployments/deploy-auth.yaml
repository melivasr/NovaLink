apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: novalink
    component: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: auth-service
  template:
    metadata:
      labels:
        app: novalink
        component: auth-service
    spec:
      containers:
        - name: auth
          image: novalink/auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: NODE_ENV
            - name: DB_HOST
              value: "users-db"
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: USERS_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: novalink
    component: auth-service
spec:
  selector:
    component: auth-service
  ports:
    - port: 3005
      targetPort: 3005
      nodePort: 30005
  type: NodePort