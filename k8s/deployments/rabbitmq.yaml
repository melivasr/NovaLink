apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: novalink
    component: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      component: rabbitmq
  template:
    metadata:
      labels:
        app: novalink
        component: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "novalink"
            - name: RABBITMQ_DEFAULT_PASS
              value: "novalink_pass"

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: novalink
    component: rabbitmq
spec:
  selector:
    component: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
  type: ClusterIP