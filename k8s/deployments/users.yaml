# ═══════════════════════════════════════════════════════════
#  Users Service — Deployment + Service
# ═══════════════════════════════════════════════════════════

# ─── Base de datos PostgreSQL para Usuarios ───────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db
  labels:
    app: novalink
    component: users-db
spec:
  replicas: 1
  selector:
    matchLabels:
      component: users-db
  template:
    metadata:
      labels:
        app: novalink
        component: users-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: USERS_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: users-db-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "novalink_user", "-d", "users_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: users-db-storage
          emptyDir: {}   # Cambiar a PersistentVolumeClaim en producción

---
apiVersion: v1
kind: Service
metadata:
  name: users-db
  labels:
    app: novalink
    component: users-db
spec:
  selector:
    component: users-db
  ports:
    - port: 5432
      targetPort: 5432
  # ClusterIP: solo accesible dentro del clúster (la DB no se expone al exterior)
  type: ClusterIP

---
# ─── Servicio de Usuarios ─────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  labels:
    app: novalink
    component: users-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: users-service
  template:
    metadata:
      labels:
        app: novalink
        component: users-service
    spec:
      containers:
        - name: users
          image: novalink/users-service:2317a4cca10e5fe715c291cddb20ff7c75cf9512
          # En Minikube se usa la imagen local; no se descarga de registry
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: NODE_ENV
            - name: DB_HOST
              value: "users-db"    # Nombre del Service de la DB arriba
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: USERS_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  labels:
    app: novalink
    component: users-service
spec:
  selector:
    component: users-service
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001    # Accesible desde fuera del clúster via minikube ip:30001
  type: NodePort
