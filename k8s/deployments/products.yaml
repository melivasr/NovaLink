# ═══════════════════════════════════════════════════════════
#  Products Service — Deployment + Service
# ═══════════════════════════════════════════════════════════

# ─── Base de datos PostgreSQL para Productos ──────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-db
  labels:
    app: novalink
    component: products-db
spec:
  replicas: 1
  selector:
    matchLabels:
      component: products-db
  template:
    metadata:
      labels:
        app: novalink
        component: products-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: PRODUCTS_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: products-db-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "novalink_user", "-d", "products_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: products-db-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: products-db
  labels:
    app: novalink
    component: products-db
spec:
  selector:
    component: products-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
# ─── Servicio de Productos ────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  labels:
    app: novalink
    component: products-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: products-service
  template:
    metadata:
      labels:
        app: novalink
        component: products-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: products
          image: novalink/products-service:6f4fba9f7a9787ffd9f16f2786af729452ae5f82
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: NODE_ENV
            - name: DB_HOST
              value: "products-db"
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: PRODUCTS_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  labels:
    app: novalink
    component: products-service
spec:
  selector:
    component: products-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
      nodePort: 30002
  type: NodePort
