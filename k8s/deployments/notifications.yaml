# ═══════════════════════════════════════════════════════════
#  Notifications Service — Deployment + Service
# ═══════════════════════════════════════════════════════════

# ─── Base de datos PostgreSQL para Notificaciones ─────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-db
  labels:
    app: novalink
    component: notifications-db
spec:
  replicas: 1
  selector:
    matchLabels:
      component: notifications-db
  template:
    metadata:
      labels:
        app: novalink
        component: notifications-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: NOTIFICATIONS_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: notifications-db-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "novalink_user", "-d", "notifications-db"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: notifications-db-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: notifications-db
  labels:
    app: novalink
    component: notifications-db
spec:
  selector:
    component: notifications-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
# ─── Servicio de Notificaciones ───────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  labels:
    app: novalink
    component: notifications-service
spec:
  replicas: 1
  selector:
    matchLabels:
      component: notifications-service
  template:
    metadata:
      labels:
        app: novalink
        component: notifications-service
    spec:
      containers:
        - name: notifications
          image: novalink/notifications-service:fa7a82cde47b60d509e5197ea21f2bfe7958b4b2
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: NODE_ENV
            - name: DB_HOST
              value: "notifications-db"
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: NOTIFICATIONS_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novalink-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: novalink-config
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  labels:
    app: novalink
    component: notifications-service
spec:
  selector:
    component: notifications-service
  ports:
    - port: 3004
      targetPort: 3004
      nodePort: 30004
  type: NodePort
