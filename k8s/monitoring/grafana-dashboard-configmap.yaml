apiVersion: v1
kind: ConfigMap
metadata:
  name: novalink-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  novalink-dashboard.json: |
    {
      "title": "NovaLink - Observabilidad de Microservicios",
      "uid": "novalink-obs",
      "schemaVersion": 38,
      "version": 2,
      "tags": ["novalink"],
      "timezone": "browser",
      "time": { "from": "now-5m", "to": "now" },
      "refresh": "5s",
      "panels": [
        {
          "id": 1,
          "title": "Réplicas activas — Orders",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "max(kube_deployment_status_replicas_available{namespace=\"default\", deployment=\"orders-service\"})",
            "legendFormat": "orders-service"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": 0 }, { "color": "green", "value": 1 }] },
              "mappings": []
            }
          }
        },
        {
          "id": 2,
          "title": "Réplicas activas — Products",
          "type": "stat",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [{
            "expr": "max(kube_deployment_status_replicas_available{namespace=\"default\", deployment=\"products-service\"})",
            "legendFormat": "products-service"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": 0 }, { "color": "green", "value": 1 }] },
              "mappings": []
            }
          }
        },
        {
          "id": 3,
          "title": "Estado UP / DOWN",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "max(kube_deployment_status_replicas_available{namespace=\"default\", deployment=\"orders-service\"}) > bool 0",
              "legendFormat": "orders-service"
            },
            {
              "expr": "max(kube_deployment_status_replicas_available{namespace=\"default\", deployment=\"products-service\"}) > bool 0",
              "legendFormat": "products-service"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "orientation": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": 0 }, { "color": "green", "value": 1 }] },
              "mappings": [{ "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } }]
            }
          }
        },
        {
          "id": 5,
          "title": "CPU Usage por Pod (cores)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "sum(rate(process_cpu_seconds_total{job=\"orders-service\"}[2m]))",
              "legendFormat": "orders-service"
            },
            {
              "expr": "sum(rate(process_cpu_seconds_total{job=\"products-service\"}[2m]))",
              "legendFormat": "products-service"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "cores", "custom": { "lineWidth": 2, "spanNulls": true } } }
        },
        {
          "id": 6,
          "title": "Memoria por Pod (MB)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{namespace=\"default\", pod=~\"orders-service.*\"}) / 1024 / 1024",
              "legendFormat": "orders-service"
            },
            {
              "expr": "sum(container_memory_usage_bytes{namespace=\"default\", pod=~\"products-service.*\"}) / 1024 / 1024",
              "legendFormat": "products-service"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "mbytes", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 7,
          "title": "Requests por Segundo",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 11, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"orders-service\"}[1m]))",
              "legendFormat": "orders-service"
            },
            {
              "expr": "sum(rate(http_requests_total{job=\"products-service\"}[1m]))",
              "legendFormat": "products-service"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 8,
          "title": "Latencia Promedio HTTP (ms)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 11, "w": 12, "h": 7 },
          "options": { "spanNulls": true },
          "targets": [
            {
              "expr": "last_over_time((1000 * sum(rate(http_request_duration_seconds_sum{job=\"orders-service\"}[5m])) / sum(rate(http_request_duration_seconds_count{job=\"orders-service\"}[5m])))[10m:30s])",
              "legendFormat": "orders avg"
            },
            {
              "expr": "last_over_time((1000 * sum(rate(http_request_duration_seconds_sum{job=\"products-service\"}[5m])) / sum(rate(http_request_duration_seconds_count{job=\"products-service\"}[5m])))[10m:30s])",
              "legendFormat": "products avg"
            },
            {
              "expr": "last_over_time((1000 * histogram_quantile(0.95, sum by (le)(rate(http_request_duration_seconds_bucket{job=\"orders-service\"}[5m]))))[10m:30s])",
              "legendFormat": "orders p95"
            },
            {
              "expr": "last_over_time((1000 * histogram_quantile(0.95, sum by (le)(rate(http_request_duration_seconds_bucket{job=\"products-service\"}[5m]))))[10m:30s])",
              "legendFormat": "products p95"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "lineWidth": 2, "spanNulls": true }, "color": { "mode": "palette-classic" } } }
        },
        {
          "id": 13,
          "title": "Saturación — Memoria en uso vs disponible (MB)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 18, "w": 24, "h": 6 },
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{namespace=\"default\", pod=~\"orders-service.*\"}) / 1024 / 1024",
              "legendFormat": "orders usado"
            },
            {
              "expr": "sum(container_memory_usage_bytes{namespace=\"default\", pod=~\"products-service.*\"}) / 1024 / 1024",
              "legendFormat": "products usado"
            },
            {
              "expr": "node_memory_MemAvailable_bytes / 1024 / 1024",
              "legendFormat": "nodo disponible"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "mbytes", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 10,
          "title": "Pedidos Creados (métricas de negocio)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 6 },
          "targets": [
            {
              "expr": "sum(rate(orders_created_total[1m])) * 60",
              "legendFormat": "pedidos / min"
            },
            {
              "expr": "sum(rate(orders_cancelled_total[1m])) * 60",
              "legendFormat": "cancelados / min"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 11,
          "title": "Consultas de Habilidades (métricas de negocio)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 6 },
          "targets": [
            {
              "expr": "sum(rate(skills_queried_total[1m])) * 60",
              "legendFormat": "consultas / min"
            },
            {
              "expr": "sum(rate(skills_created_total[1m])) * 60",
              "legendFormat": "habilidades creadas / min"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 } } }
        }
      ]
    }
