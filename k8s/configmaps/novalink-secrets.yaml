# ═══════════════════════════════════════════════════════════
#  Secret — Credenciales sensibles (base64 encoded)
#  Para encodear: echo -n "valor" | base64
#
#  Valores actuales (cambiar en producción real):
#    novalink_user  → bm92YWxpbmtfdXNlcg==
#    novalink_pass  → bm92YWxpbmtfcGFzcw==
#    users_db       → dXNlcnNfZGI=
#    products_db    → cHJvZHVjdHNfZGI=
#    orders_db      → b3JkZXJzX2Ri
# ═══════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: novalink-secrets
  namespace: default
  labels:
    app: novalink
type: Opaque
data:
  DB_PASSWORD: bm92YWxpbmtfcGFzcw==
  DB_USER: bm92YWxpbmtfdXNlcg==
  USERS_DB_NAME: dXNlcnNfZGI=
  PRODUCTS_DB_NAME: cHJvZHVjdHNfZGI=
  ORDERS_DB_NAME: b3JkZXJzX2Ri
  JWT_SECRET_KEY: bm92YWxpbmstc2VjcmV0
