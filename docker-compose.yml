version: "3.9"

# ═══════════════════════════════════════════════════════════
#  NovaLink — Docker Compose (Desarrollo Local)
#  Arquitectura EDA: servicios desacoplados via RabbitMQ
# ═══════════════════════════════════════════════════════════

networks:
  novalink-network:
    driver: bridge

volumes:
  users-db-data:
  products-db-data:
  orders-db-data:
  notifications-db-data:
  # rabbitmq-data:

services:

  # ── Message Broker: RabbitMQ ───────────────────────────────
  # rabbitmq:
  #   image: rabbitmq:3.13-management-alpine
  #   container_name: novalink-rabbitmq
  #   restart: unless-stopped
  #   ports:
  #     - "5672:5672"    # AMQP
  #     - "15672:15672"  # Management UI
  #   environment:
  #     RABBITMQ_DEFAULT_USER: novalink
  #     RABBITMQ_DEFAULT_PASS: novalink_pass
  #   volumes:
  #     - rabbitmq-data:/var/lib/rabbitmq
  #   networks:
  #     - novalink-network
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  # ── Base de datos: Usuarios ────────────────────────────────
  users-db:
    image: postgres:16-alpine
    container_name: novalink-users-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: novalink_user
      POSTGRES_PASSWORD: novalink_pass
    volumes:
      - users-db-data:/var/lib/postgresql/data
    networks:
      - novalink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novalink_user -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Servicio: Usuarios (puerto 3001) ───────────────────────
  users-service:
    build:
      context: ./services/users
      target: production
    container_name: novalink-users
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: users-db
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: novalink_user
      DB_PASSWORD: novalink_pass
      # RABBITMQ_URL: amqp://novalink:novalink_pass@rabbitmq:5672
    depends_on:
      users-db:
        condition: service_healthy
      # rabbitmq:
      #   condition: service_healthy
    networks:
      - novalink-network

  # ── Servicio: Autenticación (puerto 3005) ─────────────────
  auth-service:
    build:
      context: ./services/auth
      target: production
    container_name: novalink-auth
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      NODE_ENV: development
      DB_HOST: users-db
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: novalink_user
      DB_PASSWORD: novalink_pass
      JWT_SECRET_KEY: novalink-secret
    depends_on:
      users-db:
        condition: service_healthy
    networks:
      - novalink-network

  # ── Base de datos: Productos ───────────────────────────────
  products-db:
    image: postgres:16-alpine
    container_name: novalink-products-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: novalink_user
      POSTGRES_PASSWORD: novalink_pass
    volumes:
      - products-db-data:/var/lib/postgresql/data
    networks:
      - novalink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novalink_user -d products_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Servicio: Productos / Habilidades (puerto 3002) ────────
  products-service:
    build:
      context: ./services/products
      target: production
    container_name: novalink-products
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      DB_HOST: products-db
      DB_PORT: 5432
      DB_NAME: products_db
      DB_USER: novalink_user
      DB_PASSWORD: novalink_pass
      # RABBITMQ_URL: amqp://novalink:novalink_pass@rabbitmq:5672
    depends_on:
      products-db:
        condition: service_healthy
      # rabbitmq:
      #   condition: service_healthy
    networks:
      - novalink-network

  # ── Base de datos: Pedidos ─────────────────────────────────
  orders-db:
    image: postgres:16-alpine
    container_name: novalink-orders-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: novalink_user
      POSTGRES_PASSWORD: novalink_pass
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    networks:
      - novalink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novalink_user -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Servicio: Pedidos (puerto 3003) ────────────────────────
  # Sin dependencias HTTP a otros servicios — comunica solo via RabbitMQ
  orders-service:
    build:
      context: ./services/orders
      target: production
    container_name: novalink-orders
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: development
      DB_HOST: orders-db
      DB_PORT: 5432
      DB_NAME: orders_db
      DB_USER: novalink_user
      DB_PASSWORD: novalink_pass
      # RABBITMQ_URL: amqp://novalink:novalink_pass@rabbitmq:5672
    depends_on:
      orders-db:
        condition: service_healthy
      # rabbitmq:
      #   condition: service_healthy
    networks:
      - novalink-network

  # ── Base de datos: Notificaciones ─────────────────────────
  notifications-db:
    image: postgres:16-alpine
    container_name: novalink-notifications-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notifications-db
      POSTGRES_USER: novalink_user
      POSTGRES_PASSWORD: novalink_pass
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    networks:
      - novalink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novalink_user -d notifications-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Servicio: Notificaciones (puerto 3004) ─────────────────
  notifications-service:
    build:
      context: ./services/notifications
      target: production
    container_name: novalink-notifications
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      NODE_ENV: development
      DB_HOST: notifications-db
      DB_PORT: 5432
      DB_NAME: notifications-db
      DB_USER: novalink_user
      DB_PASSWORD: novalink_pass
      # RABBITMQ_URL: amqp://novalink:novalink_pass@rabbitmq:5672
    depends_on:
      notifications-db:
        condition: service_healthy
      # rabbitmq:
      #   condition: service_healthy
    networks:
      - novalink-network
