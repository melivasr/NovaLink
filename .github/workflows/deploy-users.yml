name: Deploy Users Service

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'services/users/**'
      - '.github/workflows/deploy-users.yml'

concurrency:
  group: deploy-users-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/users/package-lock.json

      - name: Install dependencies
        working-directory: services/users
        run: npm install

      - name: Run tests
        working-directory: services/users
        run: npm test --if-present

      - name: Lint code
        working-directory: services/users
        run: npm run lint --if-present

      - name: Build Docker image
        working-directory: services/users
        run: |
          docker build -t novalink/users-service:${{ github.sha }} .
          docker tag novalink/users-service:${{ github.sha }} novalink/users-service:latest

      - name: Push Docker image (if registry configured)
        run: |
          # docker push novalink/users-service:${{ github.sha }}
          # docker push novalink/users-service:latest
          echo "Docker image built successfully"

      - name: Update Kubernetes manifest
        run: |
          sed -i "s|novalink/users-service:latest|novalink/users-service:${{ github.sha }}|g" k8s/deployments/users.yaml

      - name: Commit and push manifest changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add k8s/deployments/users.yaml
          git commit -m "Update users-service image to ${{ github.sha }}" --allow-empty
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Deploy to Kubernetes (if cluster configured)
        run: |
          # kubectl apply -f k8s/deployments/users.yaml
          echo "Kubernetes deployment ready"
